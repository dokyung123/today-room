<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 방</title>
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF3E4;
    --paper:#FFFDF8;
    --dusk:#332C4A;
    --dusk-soft:#5B5478;
    --sage:#7FA07A;
    --sage-light:#DCE9D8;
    --sage-rgb:127,160,122;
    --rose:#E5A399;
    --rose-light:#F7DFDA;
    --butter:#F0BE5B;
    --butter-light:#FBEACB;
    --blue:#7C9FC0;
    --blue-light:#DCE6F0;
    --line:#E9DFCB;
    --strike:#B7AF9C;
    --amber-text:#B8862F;
    --input-bg:#FFFCF6;
  }
  *{box-sizing:border-box;}
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
  html{background:var(--cream);color-scheme:light;}
  body{
    margin:0;
    font-family:'Nunito',sans-serif;
    background:var(--cream);
    color:var(--dusk);
    padding:20px 14px 60px;
  }
  .wrap{max-width:640px;margin:0 auto;}
  h1,h2,h3{font-family:'DynaPuff',cursive;margin:0;text-wrap:balance;}
  .header{
    background:var(--paper);
    border:3px solid var(--dusk);
    border-radius:22px;
    padding:18px 20px;
    display:flex;
    align-items:center;
    gap:14px;
    box-shadow:5px 5px 0 var(--dusk);
    margin-bottom:18px;
  }
  .mascot{
    font-size:44px;
    width:64px;height:64px;
    display:flex;align-items:center;justify-content:center;
    background:var(--sage-light);
    border:2px solid var(--dusk);
    border-radius:16px;
    flex-shrink:0;
  }
  .header-text{flex:1;min-width:0;}
  .header-text h1{font-size:18px;color:var(--dusk);}
  .header-text p{margin:4px 0 0;font-size:13px;color:var(--dusk-soft);font-weight:600;}
  .progress-bar{
    margin-top:8px;height:10px;border-radius:6px;background:var(--line);
    border:1.5px solid var(--dusk);overflow:hidden;
  }
  .progress-fill{height:100%;background:var(--butter);width:0%;transition:width .3s;}
  .menu-btn{
    width:40px;height:40px;flex-shrink:0;
    border:2px solid var(--dusk);border-radius:12px;
    background:var(--paper);font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .menu-btn:focus-visible{outline:2px solid var(--butter);outline-offset:2px;}
  .date-banner{
    align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    background:var(--blue-light);border:2px solid var(--dusk);border-radius:14px;
    padding:10px 14px;margin-bottom:14px;font-weight:800;font-size:12.5px;color:var(--dusk);
  }
  .date-banner button{
    border:2px solid var(--dusk);background:var(--paper);border-radius:10px;
    padding:7px 12px;font-family:'Nunito',sans-serif;font-weight:800;font-size:12px;
    cursor:pointer;color:var(--dusk);flex-shrink:0;
  }
  .date-banner button:focus-visible{outline:2px solid var(--butter);outline-offset:2px;}
  .card{
    background:var(--paper);
    border:2.5px solid var(--dusk);
    border-radius:18px;
    padding:16px 18px;
    margin-bottom:16px;
    box-shadow:4px 4px 0 var(--dusk);
  }
  .card h2{font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .tag{
    font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;
    font-family:'Nunito',sans-serif;letter-spacing:.3px;
  }
  .tag.fixed{background:var(--blue-light);color:var(--blue);}
  .schedule-text{font-size:13.5px;line-height:1.6;color:var(--dusk-soft);font-weight:600;white-space:pre-line;}
  .item{
    display:flex;align-items:flex-start;gap:10px;
    padding:9px 4px;border-bottom:1px dashed var(--line);
    cursor:pointer;user-select:none;border-radius:8px;
  }
  .item:last-child{border-bottom:none;}
  .item:focus-visible,.toggle:focus-visible,.cap-btn:focus-visible{
    outline:2px solid var(--butter);outline-offset:2px;
  }
  .checkbox{
    width:20px;height:20px;flex-shrink:0;margin-top:1px;
    border:2px solid var(--dusk);border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    background:var(--paper);font-size:12px;font-weight:900;
    transition:background .15s;color:var(--paper);
  }
  .checkbox.checked{background:var(--sage);color:var(--paper);border-color:var(--sage);}
  .item-text{font-size:13.5px;font-weight:700;line-height:1.4;}
  .item-text.checked{text-decoration:line-through;color:var(--strike);}
  .item-sub{font-size:11.5px;color:var(--dusk-soft);font-weight:600;margin-top:2px;}
  .row-between{display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .toggle{
    width:40px;height:22px;border-radius:20px;border:2px solid var(--dusk);
    background:var(--line);position:relative;cursor:pointer;flex-shrink:0;
  }
  .toggle.on{background:var(--rose);}
  .toggle-knob{
    width:14px;height:14px;border-radius:50%;background:var(--paper);
    border:2px solid var(--dusk);position:absolute;top:1px;left:1px;
    transition:left .15s;
  }
  .toggle.on .toggle-knob{left:19px;}
  textarea,input[type="text"]{
    width:100%;border:2px solid var(--dusk);border-radius:12px;
    font-family:'Nunito',sans-serif;font-size:13px;padding:10px;
    background:var(--input-bg);font-weight:600;
    color:var(--dusk);
  }
  textarea{resize:vertical;min-height:56px;}
  textarea:focus-visible,input[type="text"]:focus-visible{outline:2px solid var(--butter);}
  .movie-btn{
    margin-top:10px;border:2px solid var(--dusk);background:var(--butter-light);
    border-radius:12px;padding:9px 14px;font-family:'Nunito',sans-serif;
    font-weight:800;font-size:12.5px;cursor:pointer;color:var(--dusk);
  }
  .movie-btn:active{transform:translateY(1px);}
  .movie-btn:focus-visible{outline:2px solid var(--butter);outline-offset:2px;}
  .movie-result{
    margin-top:10px;background:var(--sage-light);border-radius:12px;padding:10px 12px;
    font-size:12.5px;font-weight:700;line-height:1.5;display:none;color:var(--dusk);
  }
  .section-faith h2{color:var(--sage);}
  .section-cat h2{color:var(--blue);}
  .section-learn h2{color:var(--amber-text);}
  .section-hobby h2{color:var(--rose);}
  .footer-note{
    text-align:center;font-size:11.5px;color:var(--dusk-soft);
    font-weight:700;margin-top:24px;line-height:1.6;
  }
  .capacity-row{display:flex;gap:6px;flex-wrap:wrap;}
  .cap-btn{
    flex:1;min-width:70px;padding:10px 6px;border:2px solid var(--dusk);
    border-radius:12px;background:var(--paper);font-family:'Nunito',sans-serif;
    font-weight:800;font-size:12px;cursor:pointer;color:var(--dusk);text-align:center;
  }
  .cap-btn.active{background:var(--butter);}
  .reset-btn{
    display:block;margin:14px auto 0;background:none;border:none;
    color:var(--dusk-soft);font-size:11.5px;font-weight:700;
    text-decoration:underline;cursor:pointer;
  }
  .reset-btn:focus-visible{outline:2px solid var(--butter);outline-offset:2px;}

  /* overlay shared by side panel + modal */
  .overlay{
    position:fixed;inset:0;background:rgba(51,44,74,.4);
    opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;
  }
  .overlay.show{opacity:1;pointer-events:auto;}

  /* side panel */
  .side-panel{
    position:fixed;top:0;right:0;height:100%;
    width:min(340px,86vw);
    background:var(--paper);border-left:3px solid var(--dusk);
    z-index:50;overflow-y:auto;padding:20px 18px 32px;
    transform:translateX(100%);transition:transform .25s;
  }
  .side-panel.open{transform:translateX(0);}
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .panel-head h2{font-size:16px;}
  .icon-btn{
    width:34px;height:34px;border:2px solid var(--dusk);border-radius:10px;
    background:var(--paper);cursor:pointer;font-size:16px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .icon-btn:focus-visible{outline:2px solid var(--butter);outline-offset:2px;}
  .month-avg{font-size:13px;font-weight:700;color:var(--dusk-soft);margin-bottom:10px;}
  .month-avg b{color:var(--dusk);font-family:'DynaPuff',cursive;font-size:18px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .cal-head{font-size:10px;text-align:center;color:var(--dusk-soft);font-weight:800;padding-bottom:2px;}
  .cal-cell{
    aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:800;border:1.5px dashed var(--line);color:var(--dusk-soft);
    background:var(--cream);
  }
  .cal-cell.has-data{border-style:solid;border-color:var(--dusk);color:var(--dusk);}
  .cal-cell.today{border-width:2.5px;border-color:var(--dusk);}
  .cal-cell.viewing{border-width:2.5px;border-style:solid;border-color:var(--blue);}
  .cal-cell.empty{visibility:hidden;}
  .cal-cell[role="button"]{cursor:pointer;}
  .cal-cell[role="button"]:focus-visible{outline:2px solid var(--butter);outline-offset:2px;}
  .cal-cell[role="button"]:hover{border-color:var(--dusk);}
  .panel-divider{height:1px;background:var(--line);margin:18px 0;border:none;}
  .settings-open-btn{
    width:100%;border:2px solid var(--dusk);background:var(--butter-light);
    border-radius:12px;padding:11px 14px;font-family:'Nunito',sans-serif;
    font-weight:800;font-size:13px;cursor:pointer;color:var(--dusk);
    display:flex;align-items:center;gap:8px;justify-content:center;
  }
  .settings-open-btn:focus-visible{outline:2px solid var(--butter);outline-offset:2px;}
  .journal-open-btn{
    width:100%;border:2px solid var(--dusk);background:var(--sage-light);
    border-radius:12px;padding:11px 14px;font-family:'Nunito',sans-serif;
    font-weight:800;font-size:13px;cursor:pointer;color:var(--dusk);
    display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:8px;
  }
  .journal-open-btn:focus-visible{outline:2px solid var(--butter);outline-offset:2px;}
  select{
    width:100%;border:2px solid var(--dusk);border-radius:12px;
    font-family:'Nunito',sans-serif;font-size:13px;padding:10px;
    background:var(--input-bg);font-weight:700;color:var(--dusk);margin-bottom:8px;
  }
  select:focus-visible{outline:2px solid var(--butter);}
  .journal-entry{
    background:var(--paper);border:2px solid var(--line);border-radius:12px;
    padding:10px 12px;margin-bottom:10px;
  }
  .journal-entry-date{font-size:11.5px;font-weight:800;color:var(--dusk-soft);margin-bottom:4px;}
  .journal-entry-text{font-size:13px;font-weight:600;line-height:1.5;color:var(--dusk);white-space:pre-line;}
  .journal-empty{font-size:13px;font-weight:700;color:var(--dusk-soft);text-align:center;padding:24px 8px;}

  /* settings modal */
  .modal{
    position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
    padding:20px;opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .modal.open{opacity:1;pointer-events:auto;}
  .modal-card{
    background:var(--paper);border:3px solid var(--dusk);border-radius:20px;
    box-shadow:6px 6px 0 var(--dusk);width:min(560px,100%);max-height:85vh;
    overflow-y:auto;padding:20px;
  }
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .modal-head h2{font-size:16px;}
  .tab-row{display:flex;gap:6px;margin-bottom:16px;}
  .tab-btn{
    flex:1;padding:9px;border:2px solid var(--dusk);border-radius:10px;background:var(--paper);
    font-family:'Nunito',sans-serif;font-weight:800;font-size:12.5px;cursor:pointer;color:var(--dusk-soft);
  }
  .tab-btn.active{background:var(--blue-light);color:var(--dusk);}
  .settings-section{margin-bottom:18px;}
  .settings-section h3{font-family:'DynaPuff',cursive;font-size:13.5px;margin-bottom:8px;color:var(--dusk);}
  .edit-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
  .edit-row input[type="text"]{flex:1;padding:8px 10px;font-size:13px;}
  .del-btn{
    width:30px;height:30px;flex-shrink:0;border:2px solid var(--dusk);border-radius:8px;
    background:var(--rose-light);color:var(--dusk);font-weight:900;cursor:pointer;
  }
  .del-btn:focus-visible{outline:2px solid var(--butter);outline-offset:2px;}
  .add-item-btn{
    border:2px dashed var(--dusk);background:transparent;border-radius:10px;
    padding:8px;width:100%;font-family:'Nunito',sans-serif;font-weight:800;font-size:12.5px;
    cursor:pointer;color:var(--dusk-soft);margin-top:2px;
  }
  .sched-row{margin-bottom:12px;}
  .sched-row label{display:block;font-size:12.5px;font-weight:800;margin-bottom:5px;color:var(--dusk);}
  .sched-row textarea{min-height:60px;font-size:12.5px;}
  .section-title-row{
    display:flex;align-items:center;gap:8px;margin-bottom:10px;
    padding-bottom:10px;border-bottom:1.5px dashed var(--line);
  }
  .section-title-row input[type="text"]{
    flex:1;font-family:'DynaPuff',cursive;font-size:14px;padding:9px 10px;
  }
  .add-section-btn{
    width:100%;border:2px solid var(--dusk);background:var(--sage-light);
    border-radius:12px;padding:11px 14px;font-family:'Nunito',sans-serif;
    font-weight:800;font-size:13px;cursor:pointer;color:var(--dusk);margin-top:4px;
  }
  .add-section-btn:focus-visible{outline:2px solid var(--butter);outline-offset:2px;}
  .modal-footer{display:flex;gap:8px;margin-top:6px;position:sticky;bottom:0;background:var(--paper);padding-top:10px;}
  .btn-primary,.btn-secondary{
    flex:1;padding:11px;border-radius:12px;font-family:'Nunito',sans-serif;
    font-weight:800;font-size:13px;cursor:pointer;border:2px solid var(--dusk);
  }
  .btn-primary{background:var(--sage);color:var(--paper);}
  .btn-secondary{background:var(--paper);color:var(--dusk);}
  .btn-primary:focus-visible,.btn-secondary:focus-visible{outline:2px solid var(--butter);outline-offset:2px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="date-banner" id="dateBanner" style="display:none;">
    <span id="dateBannerText"></span>
    <button type="button" id="backToTodayBtn">오늘로 돌아가기</button>
  </div>

  <div class="header">
    <div class="mascot" id="mascot" aria-hidden="true">🐱</div>
    <div class="header-text">
      <h1 id="dateLabel">오늘</h1>
      <p id="greeting">불러오는 중...</p>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <button class="menu-btn" id="menuBtn" aria-label="메뉴 열기">📊</button>
  </div>

  <div class="card">
    <div class="row-between">
      <h2>📅 오늘의 예상 일정</h2>
      <span class="tag fixed">변동 가능</span>
    </div>
    <div class="schedule-text" id="scheduleText"></div>
    <div class="item-sub" style="margin-top:6px;">일정은 언제든 변동될 수 있어요. 아래에서 오늘 실제 여유시간을 체크해주세요</div>
  </div>

  <div class="card" style="border-color:var(--butter);">
    <h2 style="color:var(--amber-text);">⏱️ 오늘 진짜 남은 시간, 얼마나 돼요?</h2>
    <div class="item-sub" style="margin-bottom:10px;">일정이 밀려도 괜찮아요 — 지금 상황에 맞게 할 일을 다시 줄여줄게요</div>
    <div class="capacity-row" id="capacityRow"></div>
  </div>

  <div id="sectionsContainer"></div>

  <button class="reset-btn" id="resetBtn">오늘 체크 초기화</button>
  <div class="footer-note">
    체크 기록은 이 브라우저에 날짜별로 저장돼요.<br>
    막히는 항목이 있으면 클로드한테 "오늘 디자인 학습 봐줘" 처럼 편하게 말 걸어주세요 🌿
  </div>
</div>

<div class="overlay" id="overlay"></div>

<div class="side-panel" id="sidePanel" aria-hidden="true">
  <div class="panel-head">
    <h2>📊 이번 달 달성도</h2>
    <button class="icon-btn" id="closePanelBtn" aria-label="메뉴 닫기">✕</button>
  </div>
  <div class="month-avg" id="monthAvg"></div>
  <div class="cal-grid" id="calGrid"></div>
  <hr class="panel-divider">
  <button class="journal-open-btn" id="openJournalBtn">📔 배움 메모장</button>
  <button class="settings-open-btn" id="openSettingsBtn">⚙️ 카테고리 · 일정 편집</button>
</div>

<div class="modal" id="settingsModal" aria-hidden="true">
  <div class="modal-card">
    <div class="modal-head">
      <h2>⚙️ 설정</h2>
      <button class="icon-btn" id="closeModalBtn" aria-label="설정 닫기">✕</button>
    </div>
    <div class="tab-row">
      <button class="tab-btn active" id="tabCategoryBtn">카테고리</button>
      <button class="tab-btn" id="tabScheduleBtn">일정</button>
      <button class="tab-btn" id="tabLearnCatBtn">배움 카테고리</button>
    </div>
    <div id="tabCategory"></div>
    <div id="tabSchedule" style="display:none;"></div>
    <div id="tabLearnCat" style="display:none;"></div>
    <div class="modal-footer">
      <button class="btn-secondary" id="cancelSettingsBtn">취소</button>
      <button class="btn-primary" id="saveSettingsBtn">저장</button>
    </div>
  </div>
</div>

<div class="modal" id="journalModal" aria-hidden="true">
  <div class="modal-card">
    <div class="modal-head">
      <h2>📔 배움 메모장</h2>
      <div style="display:flex;gap:6px;">
        <button class="icon-btn" id="editJournalCatBtn" aria-label="배움 카테고리 편집" title="카테고리 편집">⚙️</button>
        <button class="icon-btn" id="closeJournalBtn" aria-label="메모장 닫기">✕</button>
      </div>
    </div>
    <div class="capacity-row" id="journalCategoryRow" style="margin-bottom:14px;"></div>
    <div id="journalList"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

function todayKey(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0')+"-"+String(d.getDate()).padStart(2,'0');
}
function dateKeyOf(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0')+"-"+String(d.getDate()).padStart(2,'0');
}
function parseDateKey(key){
  return new Date(key+'T00:00:00');
}
function getViewDateFromHash(){
  const h = decodeURIComponent(location.hash.replace('#',''));
  if(/^\d{4}-\d{2}-\d{2}$/.test(h) && h <= todayKey()) return h;
  return todayKey();
}
let viewDate = getViewDateFromHash();
const DAY_NAMES = ["일","월","화","수","목","금","토"];

const DEFAULT_SCHEDULES = {
  0: "11:40까지 예배 → 4시쯤 청년부 일정 끝 → 이후 교회 일정 또는 남자친구와 시간",
  1: "남자친구 만나는 날 🩷",
  2: "늦잠 시 8시 기상 → 알바 출근 (9:40~19:30) → 퇴근·식사 ~21시\n(회사 코딩교육/회의/프로젝트 변동 가능)",

function loadJSON(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(fallback));
  }catch(e){ return JSON.parse(JSON.stringify(fallback)); }
}
function loadRaw(key){
  try{
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveJSON(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
}

function loadSections(){
  const saved = loadRaw('custom:sections');
  if(saved) return saved;
  const sections = JSON.parse(JSON.stringify(DEFAULT_SECTIONS));
  const oldItemDefs = loadRaw('custom:itemDefs');
  if(oldItemDefs){
    sections.forEach(sec=>{ if(oldItemDefs[sec.id]) sec.items = oldItemDefs[sec.id]; });
  }
  return sections;
}

function loadLearnNote(dateKey){
  try{
    const raw = localStorage.getItem('learnNote:'+dateKey);
    if(!raw) return {category:'', text:''};
    try{
      const parsed = JSON.parse(raw);
      if(parsed && typeof parsed === 'object') return {category:parsed.category||'', text:parsed.text||''};
    }catch(e){}
    return {category:'', text: raw};
  }catch(e){ return {category:'', text:''}; }
}
function saveLearnNote(dateKey, note){
  try{ localStorage.setItem('learnNote:'+dateKey, JSON.stringify(note)); }catch(e){}
}

function saveSettings(){ saveJSON('settings', settings); }

function onActivate(el, fn){
  el.addEventListener('click', fn);
  el.addEventListener('keydown', (e)=>{
    if(e.key==='Enter' || e.key===' '){ e.preventDefault(); fn(); }
  });
}

function renderListInto(el, defs){
  el.innerHTML = "";
  defs.forEach(([key,label])=>{
    const checked = !!state[key];
    const row = document.createElement('div');
    row.className='item';
    row.tabIndex = 0;
    row.setAttribute('role','checkbox');
    row.setAttribute('aria-checked', String(checked));
    row.innerHTML = `<div class="checkbox ${checked?'checked':''}">${checked?'✓':''}</div>
      <div class="item-text ${checked?'checked':''}">${label}</div>`;
    onActivate(row, ()=>{
      state[key] = !state[key];
      saveState();
      renderAll();
    });
    el.appendChild(row);
  });
}

function updateProgress(){
  const allKeys = sections.flatMap(s=>s.items).map(d=>d[0]);
  const total = allKeys.length + (settings.worship?1:0);
  let done = allKeys.filter(k=>state[k]).length + (settings.worship && state.worshipDone ? 1:0);
  const pct = total? Math.round(done/total*100) : 0;
  $('progressFill').style.width = pct+"%";
  const isToday = viewDate === todayKey();
  const subject = isToday ? "오늘" : "이 날";
  $('greeting').textContent = pct===100 ? `${subject} 할 일 다 끝냈어요! 잘했어요 🌿` : `${subject} ${pct}% 완료했어요`;
}

function renderCapacity(){
  const el = $('capacityRow');
  el.innerHTML = "";
  CAPACITY_OPTIONS.forEach(opt=>{
    const btn = document.createElement('div');
    btn.className = 'cap-btn' + (state.capacity===opt.key ? ' active':'');
    btn.textContent = opt.label;
    btn.tabIndex = 0;
    btn.setAttribute('role','radio');
    btn.setAttribute('aria-checked', String(state.capacity===opt.key));
    onActivate(btn, ()=>{
      state.capacity = (state.capacity === opt.key) ? undefined : opt.key;
      saveState();
      renderAll();
    });
    el.appendChild(btn);
  });
}

  card.appendChild(h2);

  if(sec.id==='learn'){
    const focus = document.createElement('div');
    focus.className = 'item-sub';
    focus.style.marginBottom = '8px';
    focus.textContent = "🎯 " + getLearnTaskForCapacity(state.capacity, day);
    card.appendChild(focus);
  }

  const listEl = document.createElement('div');
  card.appendChild(listEl);
  renderListInto(listEl, sec.items || []);

  if(sec.id==='faith'){
    const row = document.createElement('div');
    row.className = 'row-between';
    row.style.cssText = 'margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);';
    row.innerHTML = `<div>
      <div class="item-text">이번 주 찬양팀 서는 주간</div>
      <div class="item-sub">켜두면 금/토 숙지 할일이 추가돼요</div>
    </div>`;
    const toggle = document.createElement('div');
    toggle.className = 'toggle' + (settings.worship?' on':'');
    toggle.setAttribute('role','switch');
    toggle.setAttribute('aria-checked', String(settings.worship));
    toggle.tabIndex = 0;
    toggle.innerHTML = '<div class="toggle-knob"></div>';
    onActivate(toggle, ()=>{ settings.worship = !settings.worship; saveSettings(); renderAll(); });
    row.appendChild(toggle);
    card.appendChild(row);

    if(settings.worship && (day===5 || day===6)){
      const checked = !!state.worshipDone;
      const taskBox = document.createElement('div');
      taskBox.style.marginTop = '8px';
      taskBox.innerHTML = `<div class="item" style="border:none;padding:0;" tabindex="0" role="checkbox" aria-checked="${checked}">
        <div class="checkbox ${checked?'checked':''}">${checked?'✓':''}</div>
        <div>
          <div class="item-text ${checked?'checked':''}">찬양 숙지하기</div>
          <div class="item-sub">${day===5?'내일 토요일 연습 전에 미리 숙지해두면 편해요':'오늘 저녁 연습 있어요'}</div>
        </div></div>`;
      onActivate(taskBox.querySelector('.item'), ()=>{
        state.worshipDone = !state.worshipDone;
        saveState(); renderAll();
      });
      card.appendChild(taskBox);
    }
  }

  if(sec.id==='learn'){
    const note = loadLearnNote(viewDate);

    const select = document.createElement('select');
    select.setAttribute('aria-label','오늘의 배움 카테고리 선택');
    const placeholderOpt = document.createElement('option');
    placeholderOpt.value = '';
    placeholderOpt.textContent = '카테고리 선택';
    select.appendChild(placeholderOpt);
    learnCategories.forEach(cat=>{
      const opt = document.createElement('option');
      opt.value = cat;
      opt.textContent = cat;
      select.appendChild(opt);
    });
    select.value = note.category;
    select.addEventListener('change', ()=>{
      note.category = select.value;
      saveLearnNote(viewDate, note);
    });
    card.appendChild(select);

    const ta = document.createElement('textarea');
    ta.placeholder = '오늘 배운 내용 / 막힌 부분을 짧게 메모해두면, 다음에 대화할 때 이어서 코칭해줄 수 있어요';
    ta.value = note.text;
    ta.addEventListener('blur', ()=>{
      note.text = ta.value;
      saveLearnNote(viewDate, note);
    });
    card.appendChild(ta);
  }

  if(sec.id==='hobby'){
    const chipRow = document.createElement('div');
    chipRow.className = 'capacity-row';
    const suggestResult = document.createElement('div');
    suggestResult.className = 'movie-result';
    RECOMMEND_CATEGORIES.forEach(cat=>{
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'cap-btn';
      chip.textContent = cat.label;
      chip.onclick = ()=>{
        const list = cat.list();
        const pick = list[Math.floor(Math.random()*list.length)];
        suggestResult.style.display = 'block';
        suggestResult.innerHTML = `<b>${pick.t}</b><br>${pick.w}`;
      };
      chipRow.appendChild(chip);
    });
    card.appendChild(chipRow);
    card.appendChild(suggestResult);

    const btn = document.createElement('button');
    btn.className = 'movie-btn';
    btn.type = 'button';
    btn.textContent = '🌟 오늘 뭐 볼지 추천받기';
    const result = document.createElement('div');
    result.className = 'movie-result';
    btn.onclick = ()=>{
      const cat = RECOMMEND_CATEGORIES[Math.floor(Math.random()*RECOMMEND_CATEGORIES.length)];
      const list = cat.list();
      const pick = list[Math.floor(Math.random()*list.length)];
      result.style.display = 'block';
      result.innerHTML = `<b>${pick.t}</b><br>${pick.w}`;
    };
    card.appendChild(btn);
    card.appendChild(result);
  }

  return card;
}

function renderSections(day){
  const container = $('sectionsContainer');
  container.innerHTML = '';
  sections.forEach(sec=>{
    container.appendChild(buildSectionCard(sec, day));
  });
}

function renderAll(){
  const viewed = parseDateKey(viewDate);
  const day = viewed.getDay();
  const isToday = viewDate === todayKey();
  $('dateLabel').textContent = `${viewed.getMonth()+1}월 ${viewed.getDate()}일 (${DAY_NAMES[day]})`;
  $('scheduleText').textContent = schedules[day];
  renderCapacity();
  renderSections(day);
  updateProgress();

  const banner = $('dateBanner');
  if(isToday){
    banner.style.display = 'none';
  } else {
    banner.style.display = 'flex';
    $('dateBannerText').textContent = `📅 ${viewed.getMonth()+1}월 ${viewed.getDate()}일 (${DAY_NAMES[day]}) 기록을 보고 있어요`;
  }
  $('resetBtn').textContent = isToday ? '오늘 체크 초기화' : '이 날 체크 초기화';
}

function backToToday(){
  location.hash = '';
}
onActivate($('backToTodayBtn'), backToToday);

window.addEventListener('hashchange', ()=>{
  viewDate = getViewDateFromHash();
  loadState();
  renderAll();
});

$('resetBtn').onclick = ()=>{
  const isToday = viewDate === todayKey();
  if(confirm(isToday ? "오늘 체크한 항목을 전부 초기화할까요?" : "이 날 체크한 항목을 전부 초기화할까요?")){
    state = {};
    saveState();
    renderAll();
  }
};

/* ---------- side panel: monthly achievement ---------- */

function dayPct(dateStr){
  const raw = (()=>{ try{ return localStorage.getItem('daily:'+dateStr); }catch(e){ return null; } })();
  if(!raw) return null;
  let rec;
  try{ rec = JSON.parse(raw); }catch(e){ return null; }
  const keys = sections.flatMap(s=>s.items).map(d=>d[0]);
  if(keys.length===0) return null;
  const done = keys.filter(k=>rec[k]).length;
  return Math.round(done/keys.length*100);
}

function renderCalendar(){
  const now = new Date();
  const year = now.getFullYear(), month = now.getMonth();
  const todayStr = todayKey();
  const numDays = new Date(year, month+1, 0).getDate();
  const firstWeekday = new Date(year, month, 1).getDay();

  const grid = $('calGrid');
  grid.innerHTML = "";
  DAY_NAMES.forEach(n=>{
    const h = document.createElement('div');
    h.className = 'cal-head';
    h.textContent = n;
    grid.appendChild(h);
  });
  for(let i=0;i<firstWeekday;i++){
    const blank = document.createElement('div');
    blank.className = 'cal-cell empty';
    grid.appendChild(blank);
  }
  let sum = 0, count = 0;
  for(let d=1; d<=numDays; d++){
    const dateStr = year+"-"+String(month+1).padStart(2,'0')+"-"+String(d).padStart(2,'0');
    const isPastOrToday = dateStr <= todayStr;
    const pct = isPastOrToday ? dayPct(dateStr) : null;
    const cell = document.createElement('div');
    cell.className = 'cal-cell' +
      (pct!==null?' has-data':'') +
      (dateStr===todayStr?' today':'') +
      (dateStr===viewDate && dateStr!==todayStr?' viewing':'');
    cell.textContent = d;
    if(pct!==null){
      cell.style.background = `rgba(var(--sage-rgb), ${(0.12 + pct/100*0.68).toFixed(2)})`;
      cell.title = pct+"% 완료";
      sum += pct; count++;
    }
    if(isPastOrToday){
      cell.tabIndex = 0;
      cell.setAttribute('role','button');
      cell.setAttribute('aria-label', dateStr+' 기록 보기');
      onActivate(cell, ()=>{
        location.hash = dateStr;
        closePanel();
      });
    }
    grid.appendChild(cell);
  }
  $('monthAvg').innerHTML = count>0
    ? `이번 달 평균 <b>${Math.round(sum/count)}%</b>`
    : `이번 달 기록이 아직 없어요`;
}

function openPanel(){
  renderCalendar();
  $('sidePanel').classList.add('open');
  $('sidePanel').setAttribute('aria-hidden','false');
  $('overlay').classList.add('show');
}
function closePanel(){
  $('sidePanel').classList.remove('open');
  $('sidePanel').setAttribute('aria-hidden','true');
  if(!$('settingsModal').classList.contains('open') && !$('journalModal').classList.contains('open')) $('overlay').classList.remove('show');
}
onActivate($('menuBtn'), openPanel);
onActivate($('closePanelBtn'), closePanel);

/* ---------- learning journal ---------- */

let journalFilter = 'all';

function collectJournalEntries(categoryFilter){
  const entries = [];
  for(let i=0;i<localStorage.length;i++){
    const key = localStorage.key(i);
    if(!key || key.indexOf('learnNote:')!==0) continue;
    const dateKey = key.slice('learnNote:'.length);
    const note = loadLearnNote(dateKey);
    if(!note.text || !note.text.trim()) continue;
    if(categoryFilter!=='all' && note.category!==categoryFilter) continue;
    entries.push({date:dateKey, category:note.category, text:note.text});
  }
  entries.sort((a,b)=> a.date < b.date ? 1 : -1);
  return entries;
}

function renderJournal(){
  const row = $('journalCategoryRow');
  row.innerHTML = '';
  const allChip = document.createElement('button');
  allChip.type = 'button';
  allChip.className = 'cap-btn' + (journalFilter==='all'?' active':'');
  allChip.textContent = '전체';
  allChip.onclick = ()=>{ journalFilter='all'; renderJournal(); };
  row.appendChild(allChip);
  learnCategories.forEach(cat=>{
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'cap-btn' + (journalFilter===cat?' active':'');
    chip.textContent = cat;
    chip.onclick = ()=>{ journalFilter=cat; renderJournal(); };
    row.appendChild(chip);
  });

  const list = $('journalList');
  list.innerHTML = '';
  const entries = collectJournalEntries(journalFilter);
  if(entries.length===0){
    const empty = document.createElement('div');
    empty.className = 'journal-empty';
    empty.textContent = '아직 이 카테고리로 남긴 메모가 없어요';
    list.appendChild(empty);
    return;
  }
  entries.forEach(entry=>{
    const d = parseDateKey(entry.date);
    const item = document.createElement('div');
    item.className = 'journal-entry';
    const dateEl = document.createElement('div');
    dateEl.className = 'journal-entry-date';
    dateEl.textContent = `${d.getMonth()+1}월 ${d.getDate()}일 (${DAY_NAMES[d.getDay()]})` + (entry.category?' · '+entry.category:'');
    const textEl = document.createElement('div');
    textEl.className = 'journal-entry-text';
    textEl.textContent = entry.text;
    item.appendChild(dateEl);
    item.appendChild(textEl);
    list.appendChild(item);
  });
}

function openJournal(){
  journalFilter = 'all';
  renderJournal();
  $('journalModal').classList.add('open');
  $('journalModal').setAttribute('aria-hidden','false');
  $('overlay').classList.add('show');
}
function closeJournal(){
  $('journalModal').classList.remove('open');
  $('journalModal').setAttribute('aria-hidden','true');
  if(!$('sidePanel').classList.contains('open') && !$('settingsModal').classList.contains('open')) $('overlay').classList.remove('show');
}
onActivate($('openJournalBtn'), openJournal);
onActivate($('closeJournalBtn'), closeJournal);
onActivate($('editJournalCatBtn'), ()=>{
  closeJournal();
  openSettings();
  showSettingsTab('LearnCat');
});

/* ---------- settings modal: categories + schedule ---------- */

let draftSections = null;
let draftSchedules = null;

function renderCategoryTab(){
  const el = $('tabCategory');
  el.innerHTML = "";
  draftSections.forEach((sec, secIdx)=>{
    const wrap = document.createElement('div');
    wrap.className = 'settings-section';

    const titleRow = document.createElement('div');
    titleRow.className = 'section-title-row';
    const titleInput = document.createElement('input');
    titleInput.type = 'text';
    titleInput.value = sec.label;
    titleInput.placeholder = '카테고리 이름 (예: 🏋️ 운동)';
    titleInput.setAttribute('aria-label','카테고리 제목');
    titleInput.addEventListener('input', ()=>{ draftSections[secIdx].label = titleInput.value; });
    const delSecBtn = document.createElement('button');
    delSecBtn.className = 'del-btn';
    delSecBtn.type = 'button';
    delSecBtn.textContent = '✕';
    delSecBtn.setAttribute('aria-label','카테고리 삭제');
    delSecBtn.onclick = ()=>{
      draftSections.splice(secIdx,1);
      renderCategoryTab();
    };
    titleRow.appendChild(titleInput);
    titleRow.appendChild(delSecBtn);
    wrap.appendChild(titleRow);

    (sec.items || []).forEach((pair, idx)=>{
      const row = document.createElement('div');
      row.className = 'edit-row';
      const input = document.createElement('input');
      input.type = 'text';
      input.value = pair[1];
      input.setAttribute('aria-label', sec.label+' 항목');
      input.addEventListener('input', ()=>{ draftSections[secIdx].items[idx][1] = input.value; });
      const del = document.createElement('button');
      del.className = 'del-btn';
      del.type = 'button';
      del.textContent = '✕';
      del.setAttribute('aria-label','항목 삭제');
      del.onclick = ()=>{
        draftSections[secIdx].items.splice(idx,1);
        renderCategoryTab();
      };
      row.appendChild(input);
      row.appendChild(del);
      wrap.appendChild(row);
    });

    const addBtn = document.createElement('button');
    addBtn.className = 'add-item-btn';
    addBtn.type = 'button';
    addBtn.textContent = '+ 항목 추가';
    addBtn.onclick = ()=>{
      if(!draftSections[secIdx].items) draftSections[secIdx].items = [];
      draftSections[secIdx].items.push(['custom_'+Date.now(), '']);
      renderCategoryTab();
    };
    wrap.appendChild(addBtn);
    el.appendChild(wrap);
  });

  const addSectionBtn = document.createElement('button');
  addSectionBtn.className = 'add-section-btn';
  addSectionBtn.type = 'button';
  addSectionBtn.textContent = '+ 카테고리 추가';
  addSectionBtn.onclick = ()=>{
    draftSections.push({id:'custom_sec_'+Date.now(), label:'', items:[]});
    renderCategoryTab();
  };
  el.appendChild(addSectionBtn);
}

function renderScheduleTab(){
  const el = $('tabSchedule');
  el.innerHTML = "";
  DAY_NAMES.forEach((name, day)=>{
    const row = document.createElement('div');
    row.className = 'sched-row';
    const label = document.createElement('label');
    label.textContent = name+'요일';
    label.htmlFor = 'sched_'+day;
    const ta = document.createElement('textarea');
    ta.id = 'sched_'+day;
    ta.value = draftSchedules[day] || '';
    ta.addEventListener('input', ()=>{ draftSchedules[day] = ta.value; });
    row.appendChild(label);
    row.appendChild(ta);
    el.appendChild(row);
  });
}

let draftLearnCategories = null;

function renderLearnCatTab(){
  const el = $('tabLearnCat');
  el.innerHTML = "";
  const wrap = document.createElement('div');
  wrap.className = 'settings-section';
  draftLearnCategories.forEach((cat, idx)=>{
    const row = document.createElement('div');
    row.className = 'edit-row';
    const input = document.createElement('input');
    input.type = 'text';
    input.value = cat;
    input.setAttribute('aria-label','배움 카테고리');
    input.addEventListener('input', ()=>{ draftLearnCategories[idx] = input.value; });
    const del = document.createElement('button');
    del.className = 'del-btn';
    del.type = 'button';
    del.textContent = '✕';
    del.setAttribute('aria-label','카테고리 삭제');
    del.onclick = ()=>{
      draftLearnCategories.splice(idx,1);
      renderLearnCatTab();
    };
    row.appendChild(input);
    row.appendChild(del);
    wrap.appendChild(row);
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'add-item-btn';
  addBtn.type = 'button';
  addBtn.textContent = '+ 카테고리 추가';
  addBtn.onclick = ()=>{
    draftLearnCategories.push('');
    renderLearnCatTab();
  };
  wrap.appendChild(addBtn);
  el.appendChild(wrap);
}

const SETTINGS_TABS = ['Category','Schedule','LearnCat'];
function showSettingsTab(name){
  SETTINGS_TABS.forEach(t=>{
    $('tab'+t).style.display = (t===name) ? 'block' : 'none';
    $('tab'+t+'Btn').classList.toggle('active', t===name);
  });
}

function openSettings(){
  draftSections = JSON.parse(JSON.stringify(sections));
  draftSchedules = JSON.parse(JSON.stringify(schedules));
  draftLearnCategories = JSON.parse(JSON.stringify(learnCategories));
  renderCategoryTab();
  renderScheduleTab();
  renderLearnCatTab();
  showSettingsTab('Category');
  $('settingsModal').classList.add('open');
  $('settingsModal').setAttribute('aria-hidden','false');
  $('overlay').classList.add('show');
}
function closeSettings(){
  $('settingsModal').classList.remove('open');
  $('settingsModal').setAttribute('aria-hidden','true');
  if(!$('sidePanel').classList.contains('open') && !$('journalModal').classList.contains('open')) $('overlay').classList.remove('show');
}
onActivate($('openSettingsBtn'), openSettings);
onActivate($('closeModalBtn'), closeSettings);
onActivate($('cancelSettingsBtn'), closeSettings);

onActivate($('tabCategoryBtn'), ()=>showSettingsTab('Category'));
onActivate($('tabScheduleBtn'), ()=>showSettingsTab('Schedule'));
onActivate($('tabLearnCatBtn'), ()=>showSettingsTab('LearnCat'));

onActivate($('saveSettingsBtn'), ()=>{
  draftSections = draftSections.filter(sec=>sec.label.trim()!=='');
  draftSections.forEach(sec=>{
    sec.items = (sec.items||[]).filter(pair=>pair[1].trim()!=='');
  });
  sections = draftSections;
  schedules = draftSchedules;
  learnCategories = draftLearnCategories.filter(cat=>cat.trim()!=='');
  saveJSON('custom:sections', sections);
  saveJSON('custom:schedules', schedules);
  saveJSON('custom:learnCategories', learnCategories);
  try{ localStorage.removeItem('custom:itemDefs'); }catch(e){}
  closeSettings();
  closePanel();
  renderAll();
});

$('overlay').addEventListener('click', ()=>{ closePanel(); closeSettings(); closeJournal(); });
document.addEventListener('keydown', (e)=>{
  if(e.key==='Escape'){ closePanel(); closeSettings(); closeJournal(); }
});

loadState();
renderAll();
</script>
